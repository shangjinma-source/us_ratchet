# us_ratchet 配置（零硬编码：策略与数据参数全部从此文件读取）
# 哲学：美股科技/AI/芯片为结构性上行漂移资产 → 只增不主动减（棘轮核心 + 回撤分档加仓）。

# ---------------------------------------------------------------------------
# 数据层
# ---------------------------------------------------------------------------
data:
  # 东财 push2his 历史K线在部分国内网络被稳定掐断(RemoteDisconnected) → 默认弃用，
  # 改用新浪 + 自动前复权(拆股检测)。东财能用的环境可改回 [eastmoney, sina, local_cache]。
  fallback_chain: [sina, local_cache]
  auto_split_adjust: true      # 新浪原始不复权 → 自动检测拆股做前复权
  split_detect_tol: 0.06       # 拆股比例匹配容差(只认整数倍 N:1 / 1:N)
  fqt: 1                       # 仅东财用: 0=不复权 1=前复权 2=后复权
  auto_adjust: true            # 仅 yfinance 用
  start_date: "2015-01-01"
  end_date: null               # null = 至今
  cache_dir: "data/cache"      # 成功抓取后写穿缓存（相对项目根）
  proxy:
    enabled: false
    url: "http://127.0.0.1:7890"   # 遇到过 7890/7897 不一致，按需改
    bypass_for_data_hosts: true    # 给数据域名加 NO_PROXY，绕过系统代理
  validation:
    # 复权校验：相邻收盘价跳变超过此值视为「疑似未复权的拆股」，报告里标红
    split_continuity_jump_pct: 0.35
    # 跨源一致性：两个 provider 的复权收盘价偏差超过此值则告警
    max_provider_divergence_pct: 0.03

# ---------------------------------------------------------------------------
# 组合 / 策略参数（默认值，全部可调）
# ---------------------------------------------------------------------------
portfolio:
  core_ratio: 0.90                 # 计划资金中先建核心的比例（近全仓，sleeve 求进攻）
  injection_core_ratio: 0.90       # 每笔注资中立即买核心的比例
  inject_skip_core_near_high: false  # 接近 ATH 不买核心、全转储备的保护开关（默认关）

  # 注资处理：默认立即买核心；仅当单笔注资的核心部分相对现有核心仓位过大时自动分批
  injection_mode: lump_core              # lump_core / all_reserve / ladder_core
  injection_ladder_trigger_ratio: 0.50   # 0.65Δ 超过当前核心仓位此比例 → 自动分批
  injection_ladder_tranches: 4           # 分几批
  injection_ladder_spacing_days: 5       # 每批间隔交易日

  high_definition: since_inception   # H 定义：since_inception / ath / rolling
  high_basis: close                  # H 基准：close（推荐，抗上影线毛刺）/ high
  rolling_window_days: 252           # 仅 high_definition=rolling 时生效

  rearm:
    mode: new_high                   # 创新高才全部重置（保守，省弹药）
    new_high_epsilon_pct: 0.005      # 新高需比旧 H 高出 ≥0.5% 才算数，防毛刺重置
    hysteresis_same_day_block: true  # 同一档触发后当日不可再触发

  drawdown_tiers:
    thresholds:   [-0.25, -0.45]                  # 两个深档，跳过频繁浅回撤
    deploy_ratios: [0.40, 0.60]                    # 越跌越狠
    # 想恢复四档可改回: thresholds [-0.10,-0.20,-0.30,-0.40] / ratios [0.25,0.25,0.25,0.25]

  manual_override:
    default_action: freeze           # 人工剔除默认动作：freeze（冻结，不清仓）

tactical_orders:
  enabled: true
  ma_short: 5
  ma_mid: 20
  ma_trend: 50
  ma_long: 200
  atr_window: 14
  bull_atr_mult: 0.6
  neutral_atr_mult: 1.0
  bear_atr_mult: 1.8
  bull_reserve_ratio: 0.20
  neutral_reserve_ratio: 0.12
  bear_reserve_ratio: 0.0
  min_discount_pct: 0.003
  market_gate_enabled: true
  market_gate_tickers: [QQQ, SPY]   # 大盘层门控：只下调/暂停浅层战术买入，不自动卖出、不改深跌棘轮

# ---------------------------------------------------------------------------
# 标的篮子（$50k 档：篮子和=$37,000 → 配合 safe_leg W=26% 自动播种 SGOV $13,000 → 总盘 $50,000）
# 权重=逆波动率配权，与已验证 8 名最优解误差 ±0.2% 内。要回 $1M 档把下列 ×21.6216 即可。
# 每只只需写 cap_total（你预期的金额上限）。系统自动推导：
#   weight       = cap_total / Σcap_total
#   core_target  = cap_total * core_ratio
#   reserve_quota= cap_total * (1 - core_ratio)
# 本金增加 = 在此调高某只的 cap_total（即一次注资），或用前端「加本金」。
# ---------------------------------------------------------------------------
symbols:
  - {ticker: NVDA,  cap_total: 3770}     # 逻辑/设计
  - {ticker: TXN,   cap_total: 5200}     # 模拟/IDM
  - {ticker: ASML,  cap_total: 4200}     # 设备
  - {ticker: CDNS,  cap_total: 4800}     # EDA
  - {ticker: TSM,   cap_total: 4700}     # 代工
  - {ticker: MU,    cap_total: 3300}     # 存储/内存
  - {ticker: MSFT,  cap_total: 5900}     # 大盘科技
  - {ticker: GOOG,  cap_total: 4050}     # 大盘科技

# ---------------------------------------------------------------------------
# 组合层防御腿（B 方向）：真实持有的超短债 ETF，与篮子维持 (1-W):W 的聚合比。
# W=0.26 + 执行带 0.15 是本会话数据定稿值（8名逆波动率篮子：回撤 30.1% / XIRR +27.7%，
# 稳赢 QQQ 35.6%/+19.3%）。删除此块即关闭防御层（回退纯棘轮）。
# 实盘：每日按 篮子市值 vs SGOV市值 的偏离≥exec_band 才再平衡（决策同源 compute_defensive_rebalance）。
# ---------------------------------------------------------------------------
safe_leg:
  ticker: SGOV
  target_weight: 0.26
  exec_band: 0.15
