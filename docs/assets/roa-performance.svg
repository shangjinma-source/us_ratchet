<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img"><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#eaf3f0}.muted{fill:#afc5be}.lime{fill:#d5eead}.dark{fill:#173d35}</style><rect width="1120" height="380" rx="24" fill="#102f29"/><text x="44" y="51" font-size="18" class="lime">同口径牛熊回测 / 1399 个交易日</text><text x="44" y="97" font-size="30" font-weight="700">减少回撤，而不是每年都赢</text><rect x="44" y="125" width="328" height="158" rx="14" fill="#20483e"/><text x="64" y="159" font-size="21" class="lime">当前 ROA</text><text x="64" y="204" font-size="31" font-weight="700">16.56%</text><text x="204" y="204" font-size="31" font-weight="700">22.08%</text><text x="64" y="244" font-size="17" class="muted">年化收益</text><text x="204" y="244" font-size="17" class="muted">最大收盘回撤</text><rect x="396" y="125" width="328" height="158" rx="14" fill="#20483e"/><text x="416" y="159" font-size="21" class="lime">原 V27</text><text x="416" y="204" font-size="31" font-weight="700">17.23%</text><text x="556" y="204" font-size="31" font-weight="700">71.77%</text><text x="416" y="244" font-size="17" class="muted">年化收益</text><text x="556" y="244" font-size="17" class="muted">最大收盘回撤</text><rect x="748" y="125" width="328" height="158" rx="14" fill="#20483e"/><text x="768" y="159" font-size="21" class="lime">持有 QQQ</text><text x="768" y="204" font-size="31" font-weight="700">15.52%</text><text x="908" y="204" font-size="31" font-weight="700">34.78%</text><text x="768" y="244" font-size="17" class="muted">年化收益</text><text x="908" y="244" font-size="17" class="muted">最大收盘回撤</text><text x="44" y="320" font-size="17" class="muted">2021-01-04 至 2026-07-30 · 双边各 5bp 滑点 · 零佣金研究口径 · 股息税未扣</text><text x="44" y="350" font-size="17" class="lime">2026 决定全期超额；非独立样本外认证，未来回撤不保证低于 30%。</text></svg>