<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img"><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#eaf3f0}.muted{fill:#afc5be}.lime{fill:#d5eead}.dark{fill:#173d35}</style><rect width="1120" height="480" rx="24" fill="#102f29"/><text x="44" y="54" font-size="18" class="lime">RATCHET / ROA DEFENSIVE</text><text x="44" y="104" font-size="36" font-weight="700">选盈利企业，用趋势控制暴露</text><text x="44" y="141" font-size="19" class="muted">月度选股 · 每日判断市场 · 人工执行 · 最多十只</text><rect x="44" y="178" width="328" height="216" rx="14" fill="#20483e"/><text x="66" y="213" font-size="17" class="lime">01</text><text x="66" y="252" font-size="28" font-weight="700">选股</text><text x="66" y="290" font-size="18">净利润、经营现金流为正</text><text x="66" y="321" font-size="18">ROA 与中期动量各占 50%</text><text x="66" y="352" font-size="18">最多 10 只，单股目标 10%</text><rect x="396" y="178" width="328" height="216" rx="14" fill="#20483e"/><text x="418" y="213" font-size="17" class="lime">02</text><text x="418" y="252" font-size="28" font-weight="700">牛熊切换</text><text x="418" y="290" font-size="18">QQQ 对比 200 日均线</text><text x="418" y="321" font-size="18">连续两次收盘确认状态</text><text x="418" y="352" font-size="18">下一开盘：持股 / 现金</text><rect x="748" y="178" width="328" height="216" rx="14" fill="#20483e"/><text x="770" y="213" font-size="17" class="lime">03</text><text x="770" y="252" font-size="28" font-weight="700">退出与执行</text><text x="770" y="290" font-size="18">个股峰值回落 20% 触发</text><text x="770" y="321" font-size="18">下一交易日收盘退出</text><text x="770" y="352" font-size="18">当月不买回；不足仓位留现金</text><text x="44" y="443" font-size="18" class="muted">盘中刷新保留开盘参考；当前报价与资金仍须校验。历史回撤不代表未来保证。</text></svg>